# Nginx конфиг для auto-bot-gpt админки
# Скопировать в /etc/nginx/sites-available/ и создать симлинк в sites-enabled

server {
    listen 80;
    server_name auto-gpt.yourdomain.com;  # Замени на свой домен

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/auto-bot-gpt/static/;
    }

    location /media/ {
        alias /var/www/auto-bot-gpt/media/;
    }
}
